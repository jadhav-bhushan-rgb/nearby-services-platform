name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_units.py -q

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nearby
          POSTGRES_USER: nearby
          POSTGRES_PASSWORD: nearby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nearby -d nearby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENV: test
      SECRET_KEY: test-secret-key-for-unit-tests-only
      DATABASE_URL: postgresql+psycopg2://nearby:nearby@localhost:5432/nearby
      REDIS_URL: redis://localhost:6379/0
      ADMIN_EMAIL: admin@nearby.local
      ADMIN_PASSWORD: ChangeMe123!
      SEED_SAMPLE_DATA: "false"
      RATE_LIMIT_PUBLIC_PER_MIN: "10000"
      RATE_LIMIT_SEARCH_PER_MIN: "10000"
      RATE_LIMIT_LOGIN_PER_MIN: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
        env:
          NEXT_STANDALONE: "1"
